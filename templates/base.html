<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Comment-to-DM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="{{ active }}">
  <header class="topbar">
    <a class="brand" href="/dashboard/campaigns">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2z" opacity=".9"/></svg>
      </span>
      Comment-to-DM
    </a>
    <nav class="nav">
      <a href="/dashboard/campaigns" class="{{ 'active' if active == 'campaigns' }}">Campaigns</a>
      <a href="/dashboard/settings" class="{{ 'active' if active == 'settings' }}">Settings</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
