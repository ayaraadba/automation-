[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# SQLite lives at /data/app.db (see Dockerfile). Attach a Railway Volume mounted at /data
# so the database survives redeploys: Service > Settings > Volumes > Mount path "/data".
